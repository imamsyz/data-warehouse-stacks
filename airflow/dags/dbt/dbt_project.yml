name: dw_demo
version: 1.0.0
config-version: 2
profile: default

model-paths: ["models"]
analysis-paths: ["analysis"]
test-paths: ["tests"]
seed-paths: ["seeds"]
macro-paths: ["macros"]
snapshot-paths: ["snapshots"]

target-path: "target"
clean-targets:
  - "target"
  - "dbt_packages"

models:
  dw_demo:
    +materialized: table
    staging:
      +materialized: view
      +schema: staging
    marts:
      +materialized: table
      +schema: marts

tests:
  +store_failures: true

vars:
  # Variables for data quality thresholds
  min_order_amount: 0.01
  max_order_amount: 1000000
  data_freshness_hours: 24