version: 2

sources:
  - name: raw_data
    description: "Raw data from ClickHouse"
    tables:
      - name: raw_orders
        description: "Raw orders data from source system"
        columns:
          - name: order_id
            description: "Unique identifier for each order"
            tests:
              - unique
              - not_null
          - name: order_ts
            description: "Timestamp when the order was placed"
            tests:
              - not_null
          - name: customer_id
            description: "Identifier for the customer who placed the order"
            tests:
              - not_null
          - name: amount
            description: "Order amount in decimal"
            tests:
              - not_null
          - name: status
            description: "Order status (paid, pending, cancelled)"
            tests:
              - not_null
              - accepted_values:
                  values: ['paid', 'pending', 'cancelled']

models:
  - name: stg_orders
    description: "Cleaned and validated orders data from staging layer"
    columns:
      - name: order_id
        description: "Unique identifier for each order"
        tests:
          - unique
          - not_null
      - name: order_ts
        description: "Timestamp when the order was placed"
        tests:
          - not_null
      - name: customer_id
        description: "Identifier for the customer who placed the order"
        tests:
          - not_null
      - name: amount
        description: "Order amount in decimal"
        tests:
          - not_null
          - dbt_expectations.expect_column_values_to_be_between:
              min_value: "{{ var('min_order_amount') }}"
              max_value: "{{ var('max_order_amount') }}"
      - name: status
        description: "Order status (paid, pending, cancelled)"
        tests:
          - not_null
          - accepted_values:
              values: ['paid', 'pending', 'cancelled']
      - name: amount_quality_flag
        description: "Data quality flag for amount validation"
      - name: data_freshness_flag
        description: "Data freshness flag for timestamp validation"

  - name: fct_orders
    description: "Fact table for orders with business logic applied"
    columns:
      - name: order_id
        description: "Unique identifier for each order"
        tests:
          - unique
          - not_null
      - name: customer_id
        description: "Identifier for the customer who placed the order"
        tests:
          - not_null
      - name: order_ts
        description: "Timestamp when the order was placed"
        tests:
          - not_null
      - name: amount
        description: "Order amount in decimal"
        tests:
          - not_null
          - dbt_expectations.expect_column_values_to_be_between:
              min_value: "{{ var('min_order_amount') }}"
              max_value: "{{ var('max_order_amount') }}"

  - name: dim_customers
    description: "Dimension table for customers"
    columns:
      - name: customer_id
        description: "Unique identifier for each customer"
        tests:
          - unique
          - not_null
      - name: first_order_date
        description: "Date of customer's first order"
        tests:
          - not_null
      - name: total_orders
        description: "Total number of orders placed by customer"
        tests:
          - not_null
      - name: total_amount
        description: "Total amount spent by customer"
        tests:
          - not_null
